version: "3"

services:

  postgres:
    image: postgres:13
    container_name: mlflow-postgres

    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - mlflow-network

  minio:
    image: minio/minio:latest
    container_name: mlflow-minio

    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}

    ports:
      - "${MINIO_PORT}:9000"
      - "9001:9001"

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

    networks:
      - mlflow-network

  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama

    runtime: nvidia

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    entrypoint: >
      sh -c "
      ollama serve &
      sleep 10 &&
      ollama pull ${OLLAMA_EMBED_MODEL} &&
      ollama pull ${OLLAMA_LLM_MODEL} &&
      ollama pull ${OLLAMA_LLM_MODEL_2} &&
      ollama pull ${OLLAMA_LLM_MODEL_3} &&
      wait
      "

    networks:
      - mlflow-network

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd

    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000

    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd

    volumes:
      - etcd_data:/etcd

    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - mlflow-network

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: rag_milvus

    command: milvus run standalone

    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}

    ports:
      - "${MILVUS_PORT}:19530"
      - "9091:9091"

    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_started

    restart: on-failure

    volumes:
      - milvus_data:/var/lib/milvus

    networks:
      - mlflow-network

  attu:
    image: zilliz/attu:latest
    container_name: rag_attu

    environment:
      MILVUS_URL: milvus:19530

    ports:
      - "8888:3000"

    depends_on:
      - milvus

    networks:
      - mlflow-network

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: mlflow-server

    depends_on:
      - postgres
      - minio

    ports:
      - "3000:3000"

    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY}
      - MLFLOW_TRACKING_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - BUCKET_NAME=mlflow

    networks:
      - mlflow-network

  api:
    build:
      context: .
      dockerfile: api/Dockerfile

    container_name: rag_api

    restart: on-failure

    depends_on:
      - milvus
      - ollama
      - minio
      - mlflow

    ports:
      - "8000:8000"

    environment:
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - MILVUS_COLLECTION=${MILVUS_COLLECTION}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL}
      - OLLAMA_LLM_MODEL_2=${OLLAMA_LLM_MODEL_2}
      - OLLAMA_LLM_MODEL_3=${OLLAMA_LLM_MODEL_3}
      - MLFLOW_TRACKING_URI=http://mlflow:3000

    networks:
      - mlflow-network

  interface:
    build:
      context: ./interface
      dockerfile: Dockerfile

    container_name: rag_interface

    restart: on-failure

    depends_on:
      - api

    ports:
      - "7860:7860"

    environment:
      - API_URL=http://api:8000

    networks:
      - mlflow-network

  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    container_name: rag_pipeline
    profiles:
      - pipeline
    depends_on:
      - minio
      - milvus
      - ollama
      - mlflow
    environment:
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - MILVUS_COLLECTION=${MILVUS_COLLECTION}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL}
      - OLLAMA_LLM_MODEL_2=${OLLAMA_LLM_MODEL_2}
      - OLLAMA_LLM_MODEL_3=${OLLAMA_LLM_MODEL_3}
      - MLFLOW_TRACKING_URI=http://mlflow:3000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY}
      - KAGGLE_USERNAME=${KAGGLE_USERNAME}
      - KAGGLE_KEY=${KAGGLE_KEY}
    networks:
      - mlflow-network

networks:
  mlflow-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  etcd_data:
  milvus_data:
  ollama_data:
